<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ bot_name }} · Medical Study Assistant</title>
  <style>
    :root {
      --bg: #edf3f2;
      --surface: #ffffff;
      --ink: #15272c;
      --muted: #5d7277;
      --line: #d4e0de;
      --accent: #0f766e;
      --accent-dark: #0b5952;
      --accent-soft: #dcf0ed;
      --error: #b3261e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.55;
    }

    button, textarea { font: inherit; color: inherit; }

    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 780px;
      margin: 0 auto;
      background: var(--surface);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
    }

    .brand h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .brand p { color: var(--muted); font-size: 0.875rem; }

    .clear-btn {
      background: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.875rem;
      color: var(--muted);
      cursor: pointer;
    }

    .clear-btn:hover { background: var(--bg); color: var(--ink); }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .welcome { margin: auto; text-align: center; max-width: 520px; }

    .pulse { width: 100%; max-width: 320px; height: 64px; margin-bottom: 12px; }

    .pulse path {
      fill: none;
      stroke: var(--accent);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 700;
      stroke-dashoffset: 700;
      animation: draw 2.2s ease-out forwards;
    }

    @keyframes draw { to { stroke-dashoffset: 0; } }

    .welcome h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.6rem;
      margin-bottom: 6px;
    }

    .welcome p { color: var(--muted); margin-bottom: 18px; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

    .chip {
      background: var(--accent-soft);
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .chip:hover { border-color: var(--accent); }

    .message {
      max-width: 86%;
      padding: 10px 14px;
      border-radius: 14px;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }

    .message.bot {
      align-self: flex-start;
      background: var(--bg);
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px;
    }

    .message.error {
      align-self: flex-start;
      background: #fdecea;
      border: 1px solid #f3c1bc;
      color: var(--error);
    }

    .message.bot p + p,
    .message.bot p + ul,
    .message.bot p + ol,
    .message.bot ul + p,
    .message.bot ol + p { margin-top: 8px; }

    .message.bot ul, .message.bot ol { padding-left: 22px; }

    .typing { display: flex; gap: 5px; padding: 14px; }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      animation: blink 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

    footer { padding: 12px 20px 14px; border-top: 1px solid var(--line); }

    .composer { display: flex; gap: 10px; align-items: flex-end; }

    textarea {
      flex: 1;
      resize: none;
      max-height: 140px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
    }

    .send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 10px 20px;
      font-weight: 600;
      cursor: pointer;
    }

    .send-btn:hover:not(:disabled) { background: var(--accent-dark); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .disclaimer { margin-top: 8px; font-size: 0.78rem; color: var(--muted); text-align: center; }

    @media (max-width: 600px) {
      .message { max-width: 94%; }
      .app { border: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse path { animation: none; stroke-dashoffset: 0; }
      .typing span { animation: none; opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1>{{ bot_name }}</h1>
        <p>Medical study assistant</p>
      </div>
      <button class="clear-btn" id="clearBtn" type="button">New chat</button>
    </header>

    <main id="messages" aria-live="polite">
      <section class="welcome" id="welcome">
        <svg class="pulse" viewBox="0 0 320 64" aria-hidden="true">
          <path d="M0 36 H90 L104 36 L116 10 L132 58 L146 22 L156 36 H320"/>
        </svg>
        <h2>Ask a medical question</h2>
        <p>I answer questions about medicine and health studies only.</p>
        <div class="chips">
          <button class="chip" type="button">How does the heart pump blood?</button>
          <button class="chip" type="button">Explain how antibiotics work</button>
          <button class="chip" type="button">What causes type 2 diabetes?</button>
          <button class="chip" type="button">Difference between arteries and veins</button>
        </div>
      </section>
    </main>

    <footer>
      <div class="composer">
        <textarea id="input" rows="1" maxlength="1000" placeholder="Type your medical question" aria-label="Your question"></textarea>
        <button class="send-btn" id="sendBtn" type="button">Send</button>
      </div>
      <p class="disclaimer">For education only. It does not replace advice from a doctor.</p>
    </footer>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const welcomeEl = document.getElementById("welcome");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");

    let history = [];
    let isLoading = false;

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function formatInline(text) {
      return escapeHtml(text)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*([^*\s][^*]*?)\*/g, "<em>$1</em>");
    }

    function renderMarkdown(text) {
      let html = "";
      let listType = null;

      const closeList = () => {
        if (listType) {
          html += `</${listType}>`;
          listType = null;
        }
      };

      for (const rawLine of text.split("\n")) {
        const line = rawLine.trim();
        const bullet = line.match(/^[-*•]\s+(.*)/);
        const numbered = line.match(/^\d+[.)]\s+(.*)/);

        if (bullet || numbered) {
          const type = bullet ? "ul" : "ol";
          if (listType !== type) {
            closeList();
            html += `<${type}>`;
            listType = type;
          }
          html += `<li>${formatInline((bullet || numbered)[1])}</li>`;
          continue;
        }

        closeList();
        if (!line) continue;

        const heading = line.match(/^#{1,6}\s+(.*)/);
        html += heading
          ? `<p><strong>${formatInline(heading[1])}</strong></p>`
          : `<p>${formatInline(line)}</p>`;
      }

      closeList();
      return html;
    }

    function addMessage(type, text) {
      const el = document.createElement("div");
      el.className = `message ${type}`;
      if (type === "bot") {
        el.innerHTML = renderMarkdown(text);
      } else {
        el.textContent = text;
      }
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    function showTyping() {
      const el = document.createElement("div");
      el.className = "message bot typing";
      el.innerHTML = "<span></span><span></span><span></span>";
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    function setLoading(state) {
      isLoading = state;
      sendBtn.disabled = state;
    }

    function resizeInput() {
      inputEl.style.height = "auto";
      inputEl.style.height = `${inputEl.scrollHeight}px`;
    }

    async function sendMessage(text) {
      const message = text.trim();
      if (!message || isLoading) return;

      welcomeEl.hidden = true;
      addMessage("user", message);
      inputEl.value = "";
      resizeInput();
      setLoading(true);

      const typingEl = showTyping();

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history }),
        });
        const data = await response.json();
        typingEl.remove();

        if (!response.ok) {
          addMessage("error", data.error || "Something went wrong. Please try again.");
          return;
        }

        addMessage("bot", data.reply);
        history.push({ role: "user", text: message });
        history.push({ role: "model", text: data.reply });
      } catch (error) {
        typingEl.remove();
        addMessage("error", "Could not reach the server. Check your connection and try again.");
      } finally {
        setLoading(false);
        inputEl.focus();
      }
    }

    function resetChat() {
      history = [];
      messagesEl.querySelectorAll(".message").forEach((el) => el.remove());
      welcomeEl.hidden = false;
      inputEl.focus();
    }

    sendBtn.addEventListener("click", () => sendMessage(inputEl.value));
    clearBtn.addEventListener("click", resetChat);
    inputEl.addEventListener("input", resizeInput);

    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage(inputEl.value);
      }
    });

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => sendMessage(chip.textContent));
    });
  </script>
</body>
</html>
